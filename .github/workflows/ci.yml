name: Build and verify suite

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned suite archive
        run: ./tools/build-bundle.sh dist
      - name: Verify suite installer
        run: |
          ./tests/test-installer.sh
          python3 -m unittest discover -s tests -p test_fedora.py -v
      - name: Verify archive checksum and contents
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          archive=$(find . -maxdepth 1 -name 'ufxplus-linux-suite_*_amd64.tar.gz' -print -quit)
          tar -xzf "$archive"
          cd ufxplus-linux-suite
          sha256sum --check --strict SHA256SUMS
          ./install.sh --verify-only
          cd ..
          tar -tzf "$archive" | grep -F 'ufxplus-linux-suite/packages/ufxplus-driver_'
          tar -tzf "$archive" | grep -F 'ufxplus-linux-suite/packages/rme-native-host_'
          tar -tzf "$archive" | grep -F 'ufxplus-linux-suite/packages/oscmix-ufxplus_'
          tar -tzf "$archive" | grep -F 'ufxplus-linux-suite/licenses/driver-copyright'
          tar -tzf "$archive" | grep -F 'ufxplus-linux-suite/licenses/host-copyright'
          tar -tzf "$archive" | grep -F 'ufxplus-linux-suite/licenses/mixer-copyright'
      - uses: actions/upload-artifact@v4
        with:
          name: ufxplus-linux-suite
          path: dist/*
          if-no-files-found: error

  fedora-bundle:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install package assembly tools
        run: dnf install -y git python3 rpm-build file findutils tar gzip xz sudo systemd
      - uses: actions/checkout@v4
      - name: Assemble pinned RPM payloads and verify archive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s tests -p test_fedora.py -v
          python3 tools/build-fedora-bundle.py --output dist-fedora
          cd dist-fedora
          sha256sum -c SHA256SUMS
          tar -xzf ufxplus-linux-suite_*_fedora44_x86_64.tar.gz
          cd ufxplus-linux-suite
          ./install.sh --verify-only
          ./install.sh --preflight-only
      - uses: actions/upload-artifact@v4
        with:
          name: ufxplus-linux-fedora44
          path: dist-fedora/*.tar.gz
          if-no-files-found: error
